<system>
  log_level "#{ENV['FLUENTD_LOG_LEVEL'] || 'info'}"
  root_dir /fluentd/buffer
</system>

# Aiven connects to this endpoint using RFC 5424 syslog over TLS/TCP.
<source>
  @type syslog
  @id aiven_tls_syslog
  bind 0.0.0.0
  port 6514
  tag aiven

  <transport tls>
    cert_path /run/fluentd-certs/server.crt
    private_key_path /run/fluentd-certs/server.key
  </transport>

  <parse>
    @type syslog
    message_format rfc5424
    with_priority true
  </parse>
</source>

# Used by the container health check and by optional monitoring.
<source>
  @type monitor_agent
  @id fluentd_monitor
  bind 0.0.0.0
  port 24220
</source>

<filter aiven.**>
  @type record_transformer
  enable_ruby true
  <record>
    relay fluentd
    aiven_service ${record["host"]}
    aiven_component ${record["ident"]}
    service ${ENV["DD_SERVICE"].to_s.empty? ? record["host"] : ENV["DD_SERVICE"]}
  </record>
</filter>

<match aiven.**>
  @type datadog
  @id datadog_output

  api_key "#{ENV['DD_API_KEY']}"
  host "http-intake.logs.#{ENV['DD_SITE'] || 'us3.datadoghq.com'}"
  ssl_port 443
  use_http true
  use_ssl true
  no_ssl_validation false
  use_compression true

  include_tag_key true
  tag_key fluentd_tag
  dd_source "#{ENV['DD_SOURCE'] || 'aiven'}"
  dd_tags "#{ENV['DD_TAGS'] || 'provider:aiven'}"

  <buffer>
    @type file
    path /fluentd/buffer/datadog
    flush_mode interval
    flush_interval 3s
    flush_thread_count 2
    chunk_limit_size 4m
    chunk_limit_records 500
    total_limit_size 1g
    retry_type exponential_backoff
    retry_forever true
    retry_max_interval 60s
    overflow_action block
  </buffer>
</match>
